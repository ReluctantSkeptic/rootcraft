<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rootcraft — build real words from Latin &amp; Greek roots</title>
<meta name="description" content="A game where kids snap Latin and Greek roots together to build real English words.">
<meta name="theme-color" content="#121110">
<link rel="preload" href="fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="landing.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBDF8E"/><stop offset=".6" stop-color="#ECB43E"/><stop offset="1" stop-color="#D99A26"/></linearGradient>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.6l2.83 5.95 6.53.8-4.8 4.5 1.22 6.47L12 17.15l-5.78 3.17 1.22-6.47-4.8-4.5 6.53-.8z"/></symbol>
    <symbol id="sprout" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="50" r="46" stroke-width="1.2" opacity=".45"/>
      <circle cx="50" cy="50" r="39" stroke-width=".8" opacity=".3" stroke-dasharray="1 3.2"/>
      <path d="M50 18v40" stroke-width="3"/>
      <path d="M50 30c-9-1-15-7-16-15 9 0 15 6 16 15zM50 30c9-1 15-7 16-15-9 0-15 6-16 15z" stroke-width="2.4"/>
      <path d="M50 58c0 8-6 11-12 14M50 58c0 8 6 11 12 14M50 58v20M38 72c-3 3-4 6-4 9M62 72c3 3 4 6 4 9M44 66c-6 0-10-2-13-5M56 66c6 0 10-2 13-5" stroke-width="2.2"/>
      <path d="M24 58h52" stroke-width="1.4" opacity=".6"/>
    </symbol>
  </defs>
</svg>

<header class="nav">
  <a class="mark" href="./" aria-label="Rootcraft home">Rootcraft</a>
  <a class="nav-play" href="/play/">Play</a>
</header>

<main>
  <!-- ============ HERO ============ -->
  <section class="hero" id="top">
    <div class="hero-bg" aria-hidden="true"><img src="img/port.webp" alt="" width="440" height="440" fetchpriority="low"></div>
    <h1 class="sr-only">Rootcraft: snap Latin and Greek roots together to build real words.</h1>
    <div class="forge" aria-hidden="true">
      <span class="w"><span class="p pl"></span><span class="p pr0 root">port</span><span class="p pr"></span><i class="seam"></i></span>
    </div>
    <p class="gloss" aria-hidden="true"><span class="gloss-in">to carry</span></p>
    <div class="hero-foot">
      <p class="lede">Snap Latin and Greek roots together to build real&nbsp;words.</p>
      <a class="btn-gold" href="/play/">Play</a>
    </div>
  </section>

  <!-- ============ PARADE ============ -->
  <section class="collect" aria-label="Root cards">
    <h2 class="big rv"><span class="ln"><span>Every root has</span></span> <span class="ln"><span>a <em>creature</em>.</span></span></h2>
    <div class="marquee" data-marquee>
      <div class="track"></div>
    </div>
  </section>

  <!-- ============ HOW ============ -->
  <section class="how" aria-label="How it works">
    <div class="pin how-pin">
      <h2 class="how-h">
        <span class="ln l1"><span>Real words light&nbsp;up.</span></span>
        <span class="ln l2"><span><em>Fakes</em> crumble.</span></span>
      </h2>
      <div class="how-stage">
        <div class="how-root">
          <div class="stars" aria-hidden="true">
            <svg class="star"><use href="#star"/></svg><svg class="star big"><use href="#star"/></svg><svg class="star"><use href="#star"/></svg>
          </div>
          <div class="slot-root"></div>
        </div>
        <div class="hand" aria-label="port + six word parts"></div>
      </div>
    </div>
  </section>

  <!-- ============ WORLDS ============ -->
  <section class="worlds" aria-label="Four worlds">
    <div class="pin worlds-pin">
      <div class="wtrack"></div>
      <div class="wprog" aria-hidden="true"><i></i></div>
    </div>
  </section>

  <!-- ============ END ============ -->
  <section class="end">
    <div class="hero-bg" aria-hidden="true"><img src="img/trans.webp" alt="" width="440" height="440" loading="lazy"></div>
    <h2 class="huge rv"><span class="ln"><span>Words have</span></span> <span class="ln"><span><em>roots</em>.</span></span></h2>
    <a class="btn-gold btn-xl rv-fade" href="/play/">Play</a>
  </section>
</main>

<footer class="foot">
  <span class="mark">Rootcraft</span>
  <span>Latin &amp; Greek, one piece at a time.</span>
</footer>

<script src="landing.js" defer></script>
</body>
</html>
